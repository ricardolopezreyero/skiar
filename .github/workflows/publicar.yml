name: Publicar sitio

# Cada push a la rama del proyecto arma la imagen para compartir (con las fotos reales)
# y publica la carpeta site/ en la rama gh-pages (GitHub Pages).
on:
  push:
    branches: [claude/dreamy-cori-anrnp2]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-sitio
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: pip install pillow

      - name: Armar la imagen para compartir (og.jpg)
        run: python tools/build_og.py

      - name: Revisar ligas de mapas de pistas
        run: python tools/check_mapas.py

      - name: Publicar en gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar sitio (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
